# 内部培训平台 Nginx 配置
#
# 放到 /etc/nginx/conf.d/training.conf，把 YOUR_DOMAIN 换成实际域名。
# 证书路径按 certbot 的默认位置写，用其他方式签发的自行调整。
#
# 路径规划：
#   /            -> 员工门户（Nuxt SSR，本机 3000）
#   /admin/      -> 管理后台（静态文件，Vite 打包产物）
#   /gateway/    -> 后端网关（本机 7700），转发时去掉 /gateway 前缀

# HTTP 全部跳转 HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt 续期校验需要放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 上传视频最大 2GB，要和后端 spring.servlet.multipart 保持一致
    client_max_body_size 2048m;
    # 大文件上传耗时长，超时要放宽
    client_body_timeout  600s;

    access_log /var/log/nginx/training.access.log;
    error_log  /var/log/nginx/training.error.log;

    # ---------- 后端网关 ----------
    location /gateway/ {
        proxy_pass http://127.0.0.1:7700/;   # 结尾的 / 会去掉 /gateway 前缀
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频要边下边播，必须关掉缓冲，否则 Nginx 会先把整个文件读进来
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 登录接口限流，防暴力破解（配合下面 http 段的 limit_req_zone）
    location = /gateway/system/admin/login/password {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:7700/system/admin/login/password;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 管理后台（静态）----------
    location /admin/ {
        alias /opt/training/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;    # 前端路由用 hash 模式，这里兜底
    }

    # ---------- 员工门户（Nuxt SSR）----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------
# 下面这段要放到 /etc/nginx/nginx.conf 的 http { } 里，不能放在 server 内
#
#   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# 含义：每个 IP 每分钟最多 10 次登录请求，突发允许 5 个
# ---------------------------------------------------------------
