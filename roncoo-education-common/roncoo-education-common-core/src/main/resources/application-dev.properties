spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.discovery.client.simple.instances.service-system[0].uri=http://127.0.0.1:7710
spring.cloud.discovery.client.simple.instances.service-user[0].uri=http://127.0.0.1:7720
spring.cloud.discovery.client.simple.instances.service-course[0].uri=http://127.0.0.1:7730

### ===== 本地二开配置（原本在 Nacos，现落到本地 dev profile）=====
### 数据源 Druid + MySQL
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/roncoo_education?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=roncoo
spring.datasource.password=roncoo123456
### Druid 连接池韧性配置：数据库不可用时快速失败(10s)，避免请求线程无限堆积僵死
spring.datasource.druid.max-wait=10000
spring.datasource.druid.initial-size=2
spring.datasource.druid.min-idle=2
spring.datasource.druid.max-active=20
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.keep-alive=true

### Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
### Spring Cache 用 Redis（@Cacheable 的 system/user/course 缓存按需创建；原配置在 Nacos）
spring.cache.type=redis
# 只配 type 不配 time-to-live 时，@Cacheable 写进 Redis 的键 TTL 是 -1（永不过期）。
# 后台改了网站名称/轮播/导航却一直不生效，就是因为这个：
# 缓存写进去就是永久的，而项目里原本一处 @CacheEvict 都没有。
# 现已在后台的写操作上补了 @CacheEvict，这里再加一层兜底：
# 万一将来新增的写入路径漏了清缓存，最多 10 分钟也会自己过期。
spring.cache.redis.time-to-live=600000

### Jackson 时区
# Jackson 默认按 UTC 序列化 Date，而数据库存的是本地时间，
# 结果所有接口返回的时间都比实际早 8 小时——员工看到的催办消息、
# 考试时间、创建时间全部对不上。
# 项目里 204 处 @JsonFormat(pattern=...) 没有一处带 timezone，
# 逐个补注解既漏又容易再犯，这里统一指定。
spring.jackson.time-zone=GMT+8

### 上传大小限制（视频走本地存储后要经服务端上传，默认 1MB/10MB 完全不够）
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
### 大文件上传耗时长，放宽 Tomcat 的连接超时
server.tomcat.connection-timeout=600000
server.tomcat.max-swallow-size=-1

### MyBatis
mybatis.mapper-locations=classpath*:mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

### xxl-job（本地无 admin，填占位值以通过启动；executor 注册失败不影响服务启动）
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin
xxl.job.accessToken=default_token
xxl.job.executor.appname=roncoo-executor
xxl.job.executor.address=
xxl.job.executor.ip=
xxl.job.executor.port=9999
xxl.job.executor.logpath=./logs/xxl-job
xxl.job.executor.logretentiondays=30

### 网关路由（RouteConfig.java 读取；生产在 application-prod.properties 覆盖）
roncoo.route.system=http://127.0.0.1:7710
roncoo.route.user=http://127.0.0.1:7720
roncoo.route.course=http://127.0.0.1:7730

### 本地存储私有文件（视频）的访问签名。开发用固定值方便调试，生产必须换。
roncoo.file.sign-secret=roncooLocalFileDevSecret
roncoo.file.sign-expire-seconds=7200

### JWT
jwt.token.secret=roncooEducation123456

### Seata 分布式事务：本地禁用（无 Seata 服务器；@GlobalTransactional 退化为无操作）
seata.enabled=false
