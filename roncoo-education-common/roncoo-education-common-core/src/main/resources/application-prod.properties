### ==========================================================
### 生产环境配置
###
### 启动方式：java -jar xxx.jar --spring.profiles.active=prod
###
### 敏感项（数据库密码、JWT 密钥、存储签名密钥）一律用 ${VAR:默认值} 占位，
### 由服务器上的环境变量或外部配置文件提供，**不写进代码库**。
### 外部配置放 /opt/training/conf/，启动脚本已带
###   --spring.config.additional-location=file:${BASE_DIR}/conf/
### 该目录下的同名配置项会覆盖本文件。
### ==========================================================

### ---------- 服务发现（单机部署，直连本机端口）----------
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.discovery.client.simple.instances.service-system[0].uri=${SVC_SYSTEM:http://127.0.0.1:7710}
spring.cloud.discovery.client.simple.instances.service-user[0].uri=${SVC_USER:http://127.0.0.1:7720}
spring.cloud.discovery.client.simple.instances.service-course[0].uri=${SVC_COURSE:http://127.0.0.1:7730}

### 网关路由（RouteConfig.java 读取，换机器只改这里）
roncoo.route.system=${SVC_SYSTEM:http://127.0.0.1:7710}
roncoo.route.user=${SVC_USER:http://127.0.0.1:7720}
roncoo.route.course=${SVC_COURSE:http://127.0.0.1:7730}

### ---------- 数据源 ----------
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:roncoo_education}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:roncoo}
spring.datasource.password=${DB_PASSWORD}

### Druid 连接池韧性配置：数据库不可用时快速失败，避免请求线程无限堆积僵死
spring.datasource.druid.max-wait=10000
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=50
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.keep-alive=true

### ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
# 兜底过期时间，理由见 application-dev.properties 同名配置
spring.cache.redis.time-to-live=${CACHE_TTL_MS:600000}

### ---------- 上传 ----------
### 视频经服务端上传，默认 1MB/10MB 完全不够
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:2GB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:2GB}
server.tomcat.connection-timeout=600000
server.tomcat.max-swallow-size=-1

### ---------- MyBatis ----------
mybatis.mapper-locations=classpath*:mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

### ---------- 文件访问签名 ----------
### private 目录下的文件（视频、私有文档）需要带签名和过期时间才能访问，
### 防止培训视频被公网直链盗取。密钥必须与默认值不同，否则签名可被伪造。
roncoo.file.sign-secret=${FILE_SIGN_SECRET}
### 播放地址有效期（秒），默认 2 小时，需大于最长的一个视频时长
roncoo.file.sign-expire-seconds=${FILE_SIGN_EXPIRE:7200}

### ---------- JWT ----------
### 必须是 32 位以上随机串，不要沿用默认值
jwt.token.secret=${JWT_SECRET}

### ---------- 关闭未部署的组件 ----------
### 本项目未部署 Nacos / Seata / xxl-job（学习进度定时任务已改用 Spring @Scheduled）
seata.enabled=false
xxl.job.admin.addresses=
xxl.job.accessToken=
xxl.job.executor.appname=roncoo-executor
xxl.job.executor.address=
xxl.job.executor.ip=
xxl.job.executor.port=9999
xxl.job.executor.logpath=./logs/xxl-job
xxl.job.executor.logretentiondays=30

### ---------- 日志 ----------
logging.level.root=INFO
logging.level.com.roncoo=INFO
logging.file.path=${LOG_PATH:/opt/training/logs}
